<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="赣水红途 印章星徽">
  <defs>
    <linearGradient id="s-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="1" stop-color="#8C0F0D"/>
    </linearGradient>
    <linearGradient id="s-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="1" stop-color="#C9973F"/>
    </linearGradient>
  </defs>

  <!-- 印章外框（圆角方 + 红描边） -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#FAF7F2" stroke="#C8102E" stroke-width="2.4"/>

  <!-- 五角星 -->
  <path d="M24 6 L28.6 16.7 L40.2 17.7 L31.4 25.5 L34 36.8 L24 30.7 L14 36.8 L16.6 25.5 L7.8 17.7 L19.4 16.7 Z" fill="url(#s-star)"/>
  <!-- 星心金光 -->
  <circle cx="24" cy="22" r="3.1" fill="#FFD9A0" opacity="0.9"/>

  <!-- 赣水三重波 -->
  <path d="M8 38 Q12 34.5 16 38 Q20 41.5 24 38 Q28 34.5 32 38 Q36 41.5 40 38" stroke="url(#s-wave)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M12 43 Q16 40 20 43 Q24 46 28 43 Q32 40 36 43" stroke="#C9973F" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
