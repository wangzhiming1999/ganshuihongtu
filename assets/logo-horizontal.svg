<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none" role="img" aria-label="赣水红途 logo">
  <!-- 五角星：光芒渐变 -->
  <defs>
    <linearGradient id="gsr-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="1" stop-color="#8C0F0D"/>
    </linearGradient>
    <linearGradient id="gsr-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="1" stop-color="#C9973F"/>
    </linearGradient>
  </defs>

  <!-- 星徽（24 高，含光晕水波） -->
  <g transform="translate(2,4)">
    <!-- 水波底座 -->
    <path d="M4 40 Q10 35 16 40 Q22 45 28 40 Q34 35 40 40" stroke="url(#gsr-wave)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M8 46 Q13 42 18 46 Q23 50 28 46 Q33 42 38 46" stroke="#C9973F" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55"/>
    <!-- 五角星 -->
    <path d="M22 2 L26.4 12.1 L37.4 13 L29.1 20.5 L31.5 31.3 L22 25.6 L12.5 31.3 L14.9 20.5 L6.6 13 L17.6 12.1 Z" fill="url(#gsr-star)"/>
    <!-- 星内微光 -->
    <circle cx="22" cy="17.5" r="3" fill="#FFD9A0" opacity="0.85"/>
  </g>

  <!-- 中文标准字（衬线印章风，textLength 锁定宽度防止字体 fallback 变形） -->
  <g fill="#8C0F0D" font-family="'Noto Serif SC','Source Han Serif SC','STZhongsong','SimSun','Microsoft YaHei',serif" font-weight="bold" font-size="34" letter-spacing="6">
    <text x="56" y="36" textLength="128" lengthAdjust="spacingAndGlyphs">赣水红途</text>
  </g>

  <!-- 右侧竖排小字英文 -->
  <g fill="#93817A" font-family="Arial, sans-serif" font-size="7" letter-spacing="1.4">
    <text x="56" y="49">JIANGXI RED HERITAGE</text>
  </g>
  <!-- 红色小竖线装饰 -->
  <rect x="190" y="12" width="3" height="32" rx="1.5" fill="#C8102E"/>
</svg>
